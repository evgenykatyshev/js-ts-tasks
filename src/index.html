<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML CSS Task</title>

    <link rel="stylesheet" href="./style.css" />
    <script src="./iphone.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <iphone-frame>
      <!-- Your HTML Code here -->

      <div id="screen">
        <header id="header">
          <nav id="navigation">
            <button class="nav-button nav-button_back"></button>
            <h1 id="username">user_name</h1>
            <button class="nav-button nav-button_more"></button>
          </nav>
          <div id="profile">
            <img id="userpic" src="img/userpic.svg" alt="" />
            <ul id="statistics">
              <li>
                <div class="statistics__number">129</div>
                <div class="statistics__label">Posts</div>
              </li>
              <li>
                <div class="statistics__number">3680</div>
                <div class="statistics__label">Followers</div>
              </li>
              <li>
                <div class="statistics__number">230</div>
                <div class="statistics__label">Following</div>
              </li>
            </ul>
          </div>
          <div id="business">
            <h2 id="business__name">Name</h2>
            <h2 id="business__description">Local business</h2>
            <h2 id="business__url">www.website.com</h2>
          </div>
          <menu id="actions">
            <button class="action-button action-button_primary action-button_labeled">Follow</button>
            <button class="action-button action-button_secondary action-button_labeled">Message</button>
            <button class="action-button action-button_secondary action-button_labeled">Email</button>
            <button class="action-button action-button_secondary action-button_icon"></button>
          </menu>
          <ul id="highlights">
            <li class="highlight">
              <img src="img/highlight1.svg" />
              <div class="highlight__label">Highlight</div>
            </li>
            <li class="highlight">
              <img src="img/highlight2.svg" />
              <div class="highlight__label">Highlight</div>
            </li>
            <li class="highlight">
              <img src="img/highlight3.svg" />
              <div class="highlight__label">Highlight</div>
            </li>
            <li class="highlight">
              <img src="img/highlight4.svg" />
              <div class="highlight__label">Highlight</div>
            </li>
          </ul>
        </header>
        <section id="content">
          <div id="tabbar">
            <div class="tab tab_active tab_all"></div>
            <div class="tab tab_tag"></div>
          </div>
          <div id="gallery">
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-01.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-02.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-03.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-04.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-05.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-06.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-07.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-08.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-09.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-10.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-11.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-12.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-13.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-14.png" alt="" />
            </div>
            <div class="gallery__image-cover">
              <img class="gallery__image" src="img/Img-15.png" alt="" />
            </div>
          </div>
        </section>
        <nav id="menu">
          <div class="menu__item menu__item_home"></div>
          <div class="menu__item menu__item_search"></div>
          <div class="menu__item menu__item_add"></div>
          <div class="menu__item menu__item_favorite"></div>
          <div class="menu__item menu__item_profile"></div>
        </nav>
      </div>
    </iphone-frame>
  </body>
</html>
